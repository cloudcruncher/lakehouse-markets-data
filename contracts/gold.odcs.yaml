# Data contract for the markets gold data products (ODCS v3.2.0). Checked in CI by the
# platform's tenant-contracts workflow: schema, namespaces, and policy tags (ADR 14).
apiVersion: v3.2.0
kind: DataContract
id: urn:lakehouse-markets-data:contract:gold
name: markets_gold
version: 0.2.0
status: active
tenant: markets-data
domain: markets
tags: [gold, data-product, market-data, payments, sanctions]
description:
  purpose: "Data products for every colleague: crypto candles, daily card authorisations in euro, and merchants on the UK Sanctions List."
  usage: "Rebuilt hourly at :20 (Dagster asset gold); five asset checks run after each build. Candles and daily totals rebuild the last two days; sanctions_hits is replaced whole."
  limitations: "Laptop scale: two Coinbase books and ~1 card authorisation a second (synthetic). Sanctions matching is exact on normalised names. No card tokens or people."
slaProperties:
  # The newest commit of each gold table is at most this old: built hourly at :20 (gold_hourly), with
  # room for a slow build. `freshness` is judged from Polaris table metadata, not from the data.
  - { property: freshness, value: 70, unit: m, element: crypto_ohlcv_1m, description: "Hourly build at :20" }
  - { property: freshness, value: 70, unit: m, element: card_auth_daily, description: "Hourly build at :20" }
  - { property: freshness, value: 70, unit: m, element: sanctions_hits, description: "Screened on every hourly build against today's list" }
authoritativeDefinitions:
  - { type: transformationImplementation, url: "https://github.com/cloudcruncher/lakehouse-markets-data/blob/main/src/markets_data/gold.py", description: "The SQL that builds each table (markets_data/gold.py)" }
  - { type: businessDefinition, url: "https://github.com/cloudcruncher/lakehouse-markets-data#gold-data-products", description: "Gold data products: what they hold and how they rebuild" }
schema:
  - name: crypto_ohlcv_1m
    physicalName: lakehouse.markets_gold.crypto_ohlcv_1m
    physicalType: table
    logicalType: object
    description: "One-minute candles per Coinbase product; open and close by (trade_time, trade_id)."
    dataGranularityDescription: one row per Coinbase product and minute
    customProperties:
      - { property: upstream, value: "markets_silver.trades" }
    quality:
      - { name: candles_are_consistent, type: text, dimension: consistency, severity: error, description: "low <= open, close and vwap <= high; volume and trades above zero" }
      - { name: one_candle_per_product_minute, type: text, dimension: uniqueness, severity: error, description: "no product has two candles for the same minute" }
    properties:
      - { name: product_id, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 1, classification: public, description: "Coinbase product, e.g. BTC-EUR" }
      - { name: base_currency, logicalType: string, physicalType: varchar, required: true, classification: public, description: "The asset traded, e.g. BTC" }
      - { name: quote_currency, logicalType: string, physicalType: varchar, required: true, classification: public, description: "The currency it is priced in, e.g. EUR" }
      - { name: minute, logicalType: timestamp, physicalType: timestamp(6) with time zone, required: true, primaryKey: true, primaryKeyPosition: 2, classification: public, description: "Start of the minute (UTC) the candle covers" }
      - { name: open, logicalType: number, physicalType: "decimal(30,12)", required: true, classification: public, description: "Price of the first trade in the minute (by trade time, then trade id)" }
      - { name: high, logicalType: number, physicalType: "decimal(30,12)", required: true, classification: public, description: "Highest trade price in the minute" }
      - { name: low, logicalType: number, physicalType: "decimal(30,12)", required: true, classification: public, description: "Lowest trade price in the minute" }
      - { name: close, logicalType: number, physicalType: "decimal(30,12)", required: true, classification: public, description: "Price of the last trade in the minute" }
      - { name: volume, logicalType: number, physicalType: "decimal(30,12)", required: true, classification: public, description: Units of base traded }
      - { name: notional, logicalType: number, physicalType: "decimal(30,12)", required: true, classification: public, description: Quote currency traded }
      - { name: vwap, logicalType: number, physicalType: "decimal(30,12)", required: true, classification: public, description: notional / volume }
      - { name: trades, logicalType: integer, physicalType: bigint, required: true, classification: public, description: "Number of trades in the minute" }
      - { name: built_at, logicalType: timestamp, physicalType: timestamp(6) with time zone, required: true, classification: internal, description: "When this row was last computed" }
  - name: card_auth_daily
    physicalName: lakehouse.markets_gold.card_auth_daily
    physicalType: table
    logicalType: object
    description: "Card authorisations per day (UTC), merchant country, currency and channel, in euro."
    dataGranularityDescription: one row per day, merchant country, currency and channel
    customProperties:
      - { property: upstream, value: "markets_silver.card_auths" }
    quality:
      - { name: approval_rate_is_a_share, type: text, dimension: accuracy, severity: error, description: "approval_rate is between 0 and 1 and approved never exceeds auths" }
      - { name: daily_counts_match_silver, type: text, dimension: completeness, severity: error, description: "for the days this build rebuilt, gold counts every silver authorisation exactly once" }
    properties:
      - { name: auth_date, logicalType: date, physicalType: date, required: true, primaryKey: true, primaryKeyPosition: 1, classification: internal, description: "Day (UTC) the authorisations were requested" }
      - { name: merchant_country, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 2, classification: internal, description: "ISO country of the merchant" }
      - { name: currency, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 3, classification: internal, description: "Currency the card was charged in (amounts below are converted to euro)" }
      - { name: channel, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 4, classification: internal, description: "pos (in person) or ecom (online)" }
      - { name: auths, logicalType: integer, physicalType: bigint, required: true, classification: internal, description: "Authorisations requested" }
      - { name: approved, logicalType: integer, physicalType: bigint, required: true, classification: internal, description: "Authorisations approved" }
      - { name: approval_rate, logicalType: number, physicalType: double, required: true, classification: internal, description: "approved / auths, 0 to 1" }
      - { name: amount_eur, logicalType: number, physicalType: "decimal(18,2)", required: true, classification: internal, description: "Value of all authorisations, in euro at the latest ECB rate on or before the day" }
      - { name: approved_amount_eur, logicalType: number, physicalType: "decimal(18,2)", required: true, classification: internal, description: "Value of the approved authorisations, in euro" }
      - { name: avg_amount_eur, logicalType: number, physicalType: "decimal(18,2)", required: true, classification: internal, description: "Average authorisation value, in euro" }
      - { name: built_at, logicalType: timestamp, physicalType: timestamp(6) with time zone, required: true, classification: internal, description: "When this row was last computed" }
  - name: sanctions_hits
    physicalName: lakehouse.markets_gold.sanctions_hits
    physicalType: table
    logicalType: object
    description: "Merchants whose normalised name matches an organisation on today's UK Sanctions List."
    dataGranularityDescription: one row per merchant that matches a listed organisation today
    customProperties:
      - { property: upstream, value: "markets_silver.card_auths, markets_silver.sanctions_names, markets_bronze.sanctions_targets" }
    quality:
      - { name: hits_are_on_todays_list, type: text, dimension: accuracy, severity: error, description: "every hit is a target that is listed today (not delisted)" }
    properties:
      - { name: merchant_id, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 1, classification: internal, description: "Merchant identifier" }
      - { name: merchant_name, logicalType: string, physicalType: varchar, required: true, classification: internal, description: "Merchant name as it appears on authorisations" }
      - { name: merchant_country, logicalType: string, physicalType: varchar, required: true, classification: internal, description: "ISO country of the merchant" }
      - { name: name_norm, logicalType: string, physicalType: varchar, required: true, classification: internal, description: "The name after normalisation (lower case, no accents, punctuation or legal forms): what was matched" }
      - { name: target_id, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 2, classification: public, description: "The matching target on the sanctions list" }
      - { name: target_schema, logicalType: string, physicalType: varchar, required: true, classification: public, description: "Kind of target on the list (Organization, Company, ...)" }
      - { name: program_ids, logicalType: string, physicalType: varchar, required: false, classification: public, description: "Sanctions regimes the target is listed under" }
      - { name: auths, logicalType: integer, physicalType: bigint, required: true, classification: internal, description: "Authorisations seen for this merchant" }
      - { name: amount_eur, logicalType: number, physicalType: "decimal(18,2)", required: true, classification: internal, description: "Their value, in euro" }
      - { name: first_auth, logicalType: timestamp, physicalType: timestamp(6) with time zone, required: true, classification: internal, description: "Time of the merchant's first authorisation" }
      - { name: last_auth, logicalType: timestamp, physicalType: timestamp(6) with time zone, required: true, classification: internal, description: "Time of its latest authorisation" }
      - { name: list_date, logicalType: date, physicalType: date, required: true, classification: internal, description: "When the target was first listed" }
      - { name: screened_at, logicalType: timestamp, physicalType: timestamp(6) with time zone, required: true, classification: internal, description: "When this screen ran" }
