# Local development against a running open-lakehouse platform (`make up` there first).
# Joins the platform's networks by name and mounts only this tenant's credentials folder,
# exactly as the platform's generated tenant-markets-data-code service does (ADR 14).
name: markets-data

services:
  code:
    build: .
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    networks: [data, stream, meta]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
      AWS_REGION: us-east-1
      POLARIS_ENV_FILE: /run/tenant-secrets/polaris.env
      DAGSTER_HOME: /opt/dagster/home   # local runs keep their history in the container
    volumes:
      - type: volume
        source: platform-secrets
        target: /run/tenant-secrets
        read_only: true
        volume: { subpath: tenants/markets-data }
    mem_limit: 1536m

  # The Coinbase producer, as the platform runs it (tenants/markets-data.yaml `services:`):
  # same image, Kafka only. `make feed` runs it here.
  coinbase:
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    profiles: [feed]
    entrypoint: ["python3", "-m", "markets_data.coinbase"]
    networks: [stream]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
    mem_limit: 128m

  # Card authorisations (ShadowTraffic), as the platform runs it: the licence comes from this
  # tenant's secrets folder (`make tenant-secret` on the platform); without it, it idles.
  card-auths:
    build: generators/card-auths
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:card-auths-dev
    profiles: [feed]
    networks: [stream]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SHADOWTRAFFIC_ENV_FILE: /run/tenant-secrets/shadowtraffic.env
      SHADOWTRAFFIC_ARGS: ${SHADOWTRAFFIC_ARGS:-}
    volumes:
      - type: volume
        source: platform-secrets
        target: /run/tenant-secrets
        read_only: true
        volume: { subpath: tenants/markets-data }
    mem_limit: 512m

  # The Kappa stream, as the platform runs it: Kafka -> markets_bronze.trades -> markets_silver.trades.
  # `make stream` runs it here; checkpoints live in this project's own volume.
  trades-stream:
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    profiles: [feed]
    entrypoint: ["python3", "-m", "markets_data.submit", "trades_stream.py"]
    networks: [data, stream]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
      AWS_REGION: us-east-1
      POLARIS_ENV_FILE: /run/tenant-secrets/polaris.env
    volumes:
      - type: volume
        source: platform-secrets
        target: /run/tenant-secrets
        read_only: true
        volume: { subpath: tenants/markets-data }
      - trades-state:/state
    mem_limit: 1280m

  # The card-auths stream, as the platform runs it: Kafka -> markets_bronze.card_auths ->
  # markets_silver.card_auths (in euro via markets_bronze.fx_rates), rejects to the DLQ topic.
  # `make card-stream` runs it here.
  card-auths-stream:
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    profiles: [feed]
    entrypoint: ["python3", "-m", "markets_data.submit", "card_auths_stream.py"]
    networks: [data, stream]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
      AWS_REGION: us-east-1
      POLARIS_ENV_FILE: /run/tenant-secrets/polaris.env
    volumes:
      - type: volume
        source: platform-secrets
        target: /run/tenant-secrets
        read_only: true
        volume: { subpath: tenants/markets-data }
      - card-auths-state:/state
    mem_limit: 1280m

  # The Kappa replay (make replay / replay-compare): same image and identity as the streams, a
  # bounded run with its own checkpoint volume, so the live stream is never touched.
  trades-replay: &replay
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    profiles: [replay]
    entrypoint: ["python3", "-m", "markets_data.submit", "trades_replay.py"]
    networks: [data, stream]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
      AWS_REGION: us-east-1
      POLARIS_ENV_FILE: /run/tenant-secrets/polaris.env
      RUN_EVERY: "0"   # once, not the laptop catch-up loop
      MAX_OFFSETS_PER_TRIGGER: "50000"
      RESET: ${RESET:-0}
    volumes:
      - type: volume
        source: platform-secrets
        target: /run/tenant-secrets
        read_only: true
        volume: { subpath: tenants/markets-data }
      - replay-state:/state
    mem_limit: 1280m

  trades-compare:
    <<: *replay
    entrypoint: ["python3", "-m", "markets_data.submit", "trades_compare.py"]

  trades-swap:
    <<: *replay
    entrypoint: ["python3", "-m", "markets_data.submit", "trades_swap.py"]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
      AWS_REGION: us-east-1
      POLARIS_ENV_FILE: /run/tenant-secrets/polaris.env
      RUN_EVERY: "0"
      TO: ${TO:-}
      FORCE: ${FORCE:-0}

networks:
  data: { external: true, name: open-lakehouse_data }
  stream: { external: true, name: open-lakehouse_stream }
  meta: { external: true, name: open-lakehouse_meta }

volumes:
  platform-secrets: { external: true, name: open-lakehouse_platform-secrets }
  trades-state:
  card-auths-state:
  replay-state:
