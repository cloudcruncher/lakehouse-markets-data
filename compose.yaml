# Local development against a running open-lakehouse platform (`make up` there first).
# Joins the platform's networks by name and mounts only this tenant's credentials folder,
# exactly as the platform's generated tenant-markets-data-code service does (ADR 14).
name: markets-data

services:
  code:
    build: .
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    networks: [data, stream, meta]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
      AWS_REGION: us-east-1
      POLARIS_ENV_FILE: /run/tenant-secrets/polaris.env
      DAGSTER_HOME: /opt/dagster/home   # local runs keep their history in the container
    volumes:
      - type: volume
        source: platform-secrets
        target: /run/tenant-secrets
        read_only: true
        volume: { subpath: tenants/markets-data }
    mem_limit: 1536m

  # The Coinbase producer, as the platform runs it (tenants/markets-data.yaml `services:`):
  # same image, Kafka only. `make feed` runs it here.
  coinbase:
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    profiles: [feed]
    entrypoint: ["python3", "-m", "markets_data.coinbase"]
    networks: [stream]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
    mem_limit: 128m

  # The Kappa stream, as the platform runs it: Kafka -> markets_bronze.trades -> markets_silver.trades.
  # `make stream` runs it here; checkpoints live in this project's own volume.
  trades-stream:
    image: ghcr.io/cloudcruncher/lakehouse-markets-data:dev
    profiles: [feed]
    entrypoint: ["python3", "-m", "markets_data.submit", "trades_stream.py"]
    networks: [data, stream]
    environment:
      TENANT: markets-data
      KAFKA_BOOTSTRAP: kafka:9092
      OPENLINEAGE_URL: http://marquez:5000
      AWS_REGION: us-east-1
      POLARIS_ENV_FILE: /run/tenant-secrets/polaris.env
    volumes:
      - type: volume
        source: platform-secrets
        target: /run/tenant-secrets
        read_only: true
        volume: { subpath: tenants/markets-data }
      - trades-state:/state
    mem_limit: 1280m

networks:
  data: { external: true, name: open-lakehouse_data }
  stream: { external: true, name: open-lakehouse_stream }
  meta: { external: true, name: open-lakehouse_meta }

volumes:
  platform-secrets: { external: true, name: open-lakehouse_platform-secrets }
  trades-state:
