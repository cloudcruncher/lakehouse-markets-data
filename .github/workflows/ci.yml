# Fast feedback on every PR: minutes, not tens of minutes (a release an hour is the target).
# Lint and unit tests need no Docker; the contract check is the platform's own, pinned to the
# platform release this repo builds on.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: make lint
      - run: make test

  contracts:
    uses: cloudcruncher/open-lakehouse/.github/workflows/tenant-contracts.yml@v0.3.0
    with:
      tenant: markets-data
      platform-ref: v0.3.0

  image:
    name: image builds on the platform base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t markets-data:ci .
      - name: The code location loads inside the image
        run: >
          docker run --rm --entrypoint python3 markets-data:ci -c
          "from markets_data.definitions import defs; print(sorted(k.to_user_string() for k in defs.resolve_asset_graph().get_all_asset_keys()))"
      - name: The Coinbase producer's libraries are installed
        run: docker run --rm --entrypoint python3 markets-data:ci -c "import markets_data.coinbase"
      - name: The trades stream's Spark transforms, on sample records
        run: >
          docker run --rm -v "$PWD/tests/spark:/checks:ro" --entrypoint /opt/spark/bin/spark-submit
          markets-data:ci --master "local[1]" /checks/check_stream.py
