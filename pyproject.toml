[project]
name = "markets-data"
version = "0.1.0"
description = "Markets & Payments Intelligence: a tenant of the open-lakehouse platform (ADR 14)."
readme = "README.md"
# The platform's Spark base image runs Python 3.10; code and tests must run there too.
requires-python = ">=3.10"
# Runtime libraries come from the platform base image (open-lakehouse-spark): Dagster,
# dagster-pipes, requests, PySpark. Nothing is installed on top, so the image stays small.
dependencies = []

[dependency-groups]
dev = [
    "dagster==1.13.24",  # same as the base image
    "pytest>=8",
    "requests>=2.32",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
